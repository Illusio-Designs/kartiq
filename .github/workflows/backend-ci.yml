name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install · syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # One install at the repo root (npm workspaces + Turborepo).
        run: npm ci --no-audit --no-fund

      # No test runner that works without a live DB yet, so the build gate is
      # "all source files parse". Add `npm run test:backend` here once tests
      # can run against a CI MySQL service container.
      - name: Syntax check
        working-directory: backend
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
