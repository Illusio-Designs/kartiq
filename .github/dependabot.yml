# Automatic dependency-update pull requests (reviewed like any other change).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }   # root lockfile covers backend + frontend + mobile (workspaces)
    open-pull-requests-limit: 8
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
